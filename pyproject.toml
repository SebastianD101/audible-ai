[project]
name = "audible-ai"
version = "0.1.0"
description = "Screenshot-to-waiver-wire recommendations for fantasy football"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "fastapi[standard]==0.142.4",
    "nflreadpy==0.1.5",
    "polars==1.44.2",
    "pyarrow==25.0.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.10",
]
# Training and experiment tracking only; kept out of the backend image.
ml = [
    "mlflow==3.16.1",
]

[tool.uv]
package = false
default-groups = ["dev", "ml"]
# Supply-chain guard: resolve only releases at least ~2 weeks old (see docs/decisions.md).
exclude-newer = "2026-10-09T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF", "PTH", "D"]
ignore = ["D100", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ['^frontend/', '^\.venv/']

[[tool.mypy.overrides]]
module = ["nflreadpy", "nflreadpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers -m 'not network'"
markers = ["network: hits the real nflverse API (deselected by default; run with -m network)"]
