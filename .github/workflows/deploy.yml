name: Deploy

# Builds the serve image (the Dockerfile's `serve` target: API, static UI, and this week's
# projections and rosters baked in), smoke-tests it under Render's free-tier memory limit, then
# on main pushes it to GHCR and tells Render to deploy that exact tag. See docs/deploy.md.
#
# Runs after CI passes on main, after the weekly refresh commits new projections, or by hand.
# Off main it only builds and smoke-tests. Without a RENDER_DEPLOY_HOOK_URL secret it stops
# after pushing the image, so forks and a not-yet-configured repo stay green.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # Render's free web service.
  MEMORY_LIMIT: 512m

jobs:
  deploy:
    name: Build, smoke-test, and deploy
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      # The branch head, not the triggering SHA: the refresh job deploys the commit it just
      # pushed.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true
      - run: uv sync --locked
      # The player index Sleeper import and search resolve players against (ID lookup only, never
      # training).
      - name: Ingest current-season rosters
        run: uv run python -m ml.ingest.rosters_weekly --start-season 2026 --end-season 2026
      - name: Check projections are present
        run: ls ml/data/projections/season=2026/

      - name: Name the image
        id: image
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "tag=$repo:$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build the serve image
        run: docker build --target serve --tag "${{ steps.image.outputs.tag }}" .

      - name: Smoke-test under ${{ env.MEMORY_LIMIT }}
        run: |
          docker run --detach --name api --memory "$MEMORY_LIMIT" --memory-swap "$MEMORY_LIMIT" \
            --env PORT=8000 --publish 8000:8000 "${{ steps.image.outputs.tag }}"
          status=0
          uv run python scripts/smoke_serve.py --base-url http://localhost:8000 || status=$?
          peak=$(docker exec api cat /sys/fs/cgroup/memory.peak 2>/dev/null || echo "")
          oom=$(docker inspect --format '{{.State.OOMKilled}}' api)
          {
            echo "### Serve image under $MEMORY_LIMIT"
            if [ -n "$peak" ]; then echo "Peak memory: $((peak / 1024 / 1024)) MiB"; fi
            echo "OOM-killed: $oom"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ] || [ "$oom" = "true" ]; then docker logs api | tail -50; fi
          docker rm --force api
          exit "$status"

      - name: Push to GHCR
        if: github.ref_name == 'main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "${{ steps.image.outputs.tag }}" "${{ steps.image.outputs.repo }}:latest"
          docker push "${{ steps.image.outputs.tag }}"
          docker push "${{ steps.image.outputs.repo }}:latest"

      - name: Deploy to Render
        if: github.ref_name == 'main' && env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          img=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' \
            "${{ steps.image.outputs.tag }}")
          curl --silent --show-error --fail --output /dev/null "$RENDER_DEPLOY_HOOK_URL&imgURL=$img"
          echo "::notice::Render is deploying ${{ steps.image.outputs.tag }}."
      - name: Not deployed
        if: github.ref_name != 'main' || env.RENDER_DEPLOY_HOOK_URL == ''
        run: |
          echo "::notice::Built and smoke-tested only (off main, or RENDER_DEPLOY_HOOK_URL is not set; see docs/deploy.md)."
