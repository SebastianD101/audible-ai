name: Deploy

# Builds the API image (the Dockerfile's `serve` target, with this week's projections and
# rosters baked in) and deploys it to Fly.io. See docs/deploy.md.
#
# Runs after CI passes on main, after the weekly refresh commits new projections, or by hand.
# Without a FLY_API_TOKEN secret it only builds the image, so forks and a not-yet-configured
# repo stay green.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_call:
  workflow_dispatch:
  push:  # TEMP: exercise on the branch before merge
    branches: [deploy]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy the API
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      # The branch head, not the triggering SHA: the refresh job deploys the commit it just
      # pushed.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true
      - run: uv sync --locked
      # The player index the parser matches names against (identification only, never training).
      - name: Ingest current-season rosters
        run: uv run python -m ml.ingest.rosters_weekly --start-season 2026 --end-season 2026
      - name: Check projections are present
        run: ls ml/data/projections/season=2026/

      - name: Deploy to Fly.io
        if: env.FLY_API_TOKEN != ''
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: "0.4.117"
      - if: env.FLY_API_TOKEN != ''
        run: flyctl deploy --remote-only --image-label "${GITHUB_SHA::12}"

      - name: Build only (no FLY_API_TOKEN secret)
        if: env.FLY_API_TOKEN == ''
        run: |
          echo "::notice::FLY_API_TOKEN is not set, so the image is built but not deployed (see docs/deploy.md)."
          docker build --target serve --tag audible-ai:serve .
          # Serve it and read the baked-in data: projections meta and a roster-index search.
          docker run --detach --name api --publish 8000:8000 audible-ai:serve
          for _ in $(seq 30); do curl --silent --fail localhost:8000/health && break; sleep 1; done
          curl --silent --fail localhost:8000/api/projections/meta
          curl --silent --fail "localhost:8000/api/players/search?q=allen" | head -c 300
          docker rm --force api
