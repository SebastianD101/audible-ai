name: Weekly refresh

# Every Wednesday morning (UTC), after Tuesday night's stat corrections: ingest the live season,
# project the next week, score finished weeks, commit the projections (the commit time is the
# public record that they predate kickoff), and redeploy. See docs/deploy.md.
#
# `--week auto` never overwrites a published week and refuses once a week's games have started,
# so a late or repeated run is a no-op rather than a leak.

on:
  schedule:
    - cron: "0 12 * * 3"
  workflow_dispatch:
  push:  # TEMP: exercise on the branch before merge
    branches: [deploy]

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

env:
  SEASON: "2026"
  MLFLOW_DISABLE_AGENT_HINT: "1"

jobs:
  refresh:
    name: Ingest, project, evaluate, commit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true
      - run: uv sync --locked

      # Past seasons don't change, so their raw data and features are cached; the key changes
      # when the ingest or feature code does.
      - name: Restore 2018-2025 data
        id: history
        uses: actions/cache@v5.1.0
        with:
          path: |
            ml/data/raw
            ml/data/processed
          key: history-2018-2025-${{ hashFiles('ml/ingest/**', 'ml/features/**', 'uv.lock') }}
      - name: Ingest and build 2018-2025 (cache miss)
        if: steps.history.outputs.cache-hit != 'true'
        run: |
          uv run python -m ml.ingest --start-season 2018 --end-season 2025
          uv run python -m ml.features.build --start-season 2018 --end-season 2025

      - name: Ingest the live season
        run: |
          for dataset in weekly_stats schedules rosters_weekly injuries snap_counts; do
            uv run python -m "ml.ingest.$dataset" --start-season "$SEASON" --end-season "$SEASON" --force
          done
          uv run python -m ml.ingest.players --force

      - name: Project the next week
        run: uv run python -m ml.serve.project --season "$SEASON" --week auto
      - name: Score finished weeks
        run: uv run python -m ml.serve.evaluate --season "$SEASON"

      - name: Commit new projections and the live report
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ml/data/projections "docs/live-$SEASON.md"
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No new projections or results this run."
          else
            git commit -m "Refresh $SEASON live projections and results"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Keep the MLflow runs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mlruns-${{ github.run_id }}
          path: mlruns
          retention-days: 90
          if-no-files-found: ignore

  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
